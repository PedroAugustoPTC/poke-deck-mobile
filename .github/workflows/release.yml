# Ao publicar uma release (tag vX.Y.Z): testa, gera o APK assinado e anexa como PokeDeck.apk. O GitHub publica o
# SHA-256 do arquivo (campo "digest"), que o app confere antes de instalar.
name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.11.1

      - name: Keystore (sempre a mesma chave, senão o Android recusa a atualização)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Falta o secret KEYSTORE_B64 (rode scripts/make-keystore.ps1)"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pokedeck.jks"

      - name: Testes e APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/pokedeck.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TAG: ${{ github.event.release.tag_name }}
        run: gradle --no-daemon test assembleRelease -PversionName="${TAG#v}"

      - name: Anexar à release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk PokeDeck.apk
          gh release upload "$TAG" PokeDeck.apk --clobber
